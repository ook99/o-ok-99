name: Build iOS 16 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project QingSongStats.xcodeproj \
            -target QingSongStats \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Pack IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/QingSongStats.app Payload/
          zip -qr QingSongStats-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QingSongStats-unsigned-ipa
          path: QingSongStats-unsigned.ipa
          if-no-files-found: error
